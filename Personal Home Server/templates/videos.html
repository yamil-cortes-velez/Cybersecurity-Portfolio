<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d14; font-family: monospace; color: #fff; }
  .topbar {
    width: 100%; height: 48px; background: #13131f;
    border-bottom: 1px solid #ffffff15;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
  }
  .topbar a { color: #22d3ee; text-decoration: none; font-size: 13px; }
  .title { font-size: 15px; font-weight: bold; letter-spacing: 3px; }
  .content { padding: 20px; }
  .video-list { margin-top: 16px; }
  .video-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #13131f;
    border: 1px solid #ffffff10; border-radius: 8px; margin-bottom: 8px;
  }
  .video-name { flex: 1; font-size: 13px; }
  .video-actions { display: flex; gap: 8px; }
  .btn {
    padding: 6px 14px; border-radius: 6px;
    font-family: monospace; font-size: 11px; cursor: pointer;
    border: 1px solid #22d3ee44; color: #22d3ee; background: #22d3ee11;
  }
  .upload-section {
    margin-top: 20px; padding: 16px; background: #13131f;
    border: 1px dashed #ffffff20; border-radius: 8px;
  }
  .upload-btn {
    margin-top: 10px; padding: 8px 20px; background: #22d3ee22;
    border: 1px solid #22d3ee44; border-radius: 6px;
    color: #22d3ee; font-family: monospace; cursor: pointer;
  }
  video { width: 100%; border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← BACK</a>
  <div class="title">VIDEOS</div>
  <div style="width:60px"></div>
</div>

<div class="content">
  <form method="POST" action="/upload_video" enctype="multipart/form-data">
    <div class="upload-section">
      <div style="color:#888; font-size:11px; margin-bottom:8px;">UPLOAD A VIDEO</div>
      <input type="file" name="file" accept="video/*" style="color:#fff"/>
      <br>
      <button class="upload-btn" type="submit">UPLOAD</button>
    </div>
  </form>

  <div class="video-list">
    {% for video in videos %}
    <div class="video-item">
      <span class="video-name">🎬 {{ video }}</span>
      <div class="video-actions">
        <a href="/stream/{{ video }}"><button class="btn" type="button">PLAY</button></a>
        <a href="/download/{{ video }}"><button class="btn" type="button">SAVE</button></a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d14; font-family: monospace; color: #fff; }
  .topbar {
    width: 100%; height: 48px; background: #13131f;
    border-bottom: 1px solid #ffffff15;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
  }
  .topbar a { color: #f59e0b; text-decoration: none; font-size: 13px; }
  .title { font-size: 15px; font-weight: bold; letter-spacing: 3px; }
  .content { padding: 20px; }
  .device-list { margin-top: 16px; }
  .device-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #13131f;
    border: 1px solid #ffffff10; border-radius: 8px; margin-bottom: 8px;
    cursor: pointer;
  }
  .device-item:hover { border-color: #f59e0b44; }
  .device-item input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; }
  .device-name { flex: 1; font-size: 14px; }
  .device-ip { color: #555; font-size: 11px; }
  .send-btn {
    margin-top: 20px; padding: 12px 32px; background: #f59e0b22;
    border: 1px solid #f59e0b44; border-radius: 8px;
    color: #f59e0b; font-family: monospace; font-size: 14px; cursor: pointer;
    width: 100%;
  }
  .add-device {
    margin-top: 12px; padding: 12px 32px; background: #ffffff08;
    border: 1px solid #ffffff15; border-radius: 8px;
    color: #888; font-family: monospace; font-size: 13px; cursor: pointer;
    width: 100%;
  }
  .no-devices { color: #555; font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← BACK</a>
  <div class="title">SEND</div>
  <div style="width:60px"></div>
</div>

<div class="content">
  <form method="POST" action="/send_file">
    <div style="color:#888; font-size:11px; letter-spacing:1px;">SELECT DEVICE</div>
    <div class="device-list">
      {% if devices %}
        {% for device in devices %}
        <div class="device-item">
          <input type="radio" name="device_id" value="{{ device.id }}">
          <span class="device-name">{{ device.name }}</span>
          <span class="device-ip">{{ device.wireguard_ip }}</span>
        </div>
        {% endfor %}
      {% else %}
        <div class="no-devices">No devices registered yet.</div>
      {% endif %}
    </div>
    <button class="send-btn" type="submit">SEND FILES →</button>
  </form>
  <a href="/add_device"><button class="add-device">+ ADD DEVICE</button></a>
</div>
</body>
</html>
